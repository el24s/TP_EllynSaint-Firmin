name: CI

on:
  push:
    branches: [master, develop]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ '21', '25' ]
    steps:
      - uses: actions/checkout@v5

      - name: Configurer le JDK [21 & 25]
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Donner le droit d'exécution à mvnw
        run: chmod +x mvnw

      - name: Build et tester
        run: ./mvnw -B clean verify

      - name: Publier le rapport JaCoCo
        uses: actions/upload-artifact@v5
        with:
          name: rapport-jacoco
          path: target/site/jacoco/

      - name: Publier le .jar (JDK 21 seulement)
        if: matrix.java-version == '21'
        uses: actions/upload-artifact@v5
        with:
          name: application-jar
          path: target/*.jar

  publish-image:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Télécharger le .jar
        uses: actions/download-artifact@v5
        with:
          name: application-jar
          path: target/

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.REGISTRY }}/${{ vars.GHCR_USERNAME }}/biblio-api:${{ github.ref_name }}

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Télécharger le .jar
        uses: actions/download-artifact@v5
        with:
          name: application-jar
          path: target/

      - name: Créer la Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar